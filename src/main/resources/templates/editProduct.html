<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>



<form action="#" th:action="@{/updateProduct}" th:object="${product}" method="post" enctype="multipart/form-data">


    <input type="hidden" th:field="*{id}">
    <br>
    <label>product name</label><br>
    <input type="text" th:field="*{product_name}">
    <br>
    <label>status</label>
    <br>
    <input type="text" th:field="*{price}">
    <br>
    <label>Properties (JSON-like)</label><br>
    <input type="text" th:field="*{rawPropertiesForMap}">
    <br><br>

    <label>zdjęcie</label>
    <br>
    <label>Replace picture (optional)</label>
    <br>

    <br> <img th:if="${product.picture != null}" th:src="@{'/productImage/' + ${product.id}}" width="150"> <br>

    <label>New picture preview:</label>
    <input
            type="file"
            name="imageFile"
            accept="image/*"
            onchange="previewImage(event)">

    <br><br>


    <br>

    <img id="imagePreview"
         width="150"
         style="display:none;">

    <br><br>

    <button type="submit">Edit product</button>

    <script>
        function previewImage(event) {

            const image = document.getElementById("imagePreview");

            if (event.target.files && event.target.files[0]) {

                image.src = URL.createObjectURL(event.target.files[0]);
                image.style.display = "block";
            }
        }
    </script>

</form>


</body>
</html>
