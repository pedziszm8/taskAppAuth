<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Add category</title>
</head>

<body>

<form th:action="@{/addCategory}"
      th:object="${category}"
      method="post">

  <label>Name</label><br>

  <input type="text" th:field="*{category}">

  <br><br>

  <label>Description</label><br>

  <textarea th:field="*{description}"></textarea>

  <br><br>

  <button type="submit">
    Save
  </button>

</form>

</body>
</html>
